services:
  - type: web
    name: dna-auto
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    # ATENÇÃO INFRAESTRUTURA / PERSISTÊNCIA SQLITE:
    # O plano 'free' do Render usa disco efêmero (dados SQLite são perdidos a cada deploy/restart).
    # Para produção durável, migre para plan: starter (ou superior) e habilite o disco persistente abaixo,
    # definindo DB_PATH=/var/data/dna_auto.db (ou migre para banco gerenciado conforme docs/ADMIN-CENTRAL-V2.md):
    # disk:
    #   name: dna-auto-data
    #   mountPath: /var/data
    #   sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: SERVER_URL
        value: https://dna-auto-vua4.onrender.com
      - key: DB_PATH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WDAPI_TOKEN
        sync: false
      - key: ABACATEPAY_API_KEY
        sync: false
      - key: ABACATEPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://dna-auto-vua4.onrender.com,https://dna-auto-byin.onrender.com,https://cliente-app.onrender.com,https://oficina-app.onrender.com

  - type: web
    name: cliente-app
    runtime: static
    buildCommand: echo "Building cliente.app"
    staticPublishPath: ./cliente.app
    envVars:
      - key: API_URL
        value: https://dna-auto-vua4.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: oficina-app
    runtime: static
    buildCommand: echo "Building oficina.app"
    staticPublishPath: ./oficina.app
    envVars:
      - key: API_URL
        value: https://dna-auto-vua4.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
