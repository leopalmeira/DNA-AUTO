<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DNA AUTO — Garagem Digital & Acesso Oficial</title>

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" href="/img/dna-app-icon.png" />
  <link rel="apple-touch-icon" href="/img/dna-app-icon.png" />

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #030712;
      --bg-deep: #050B14;
      --bg-card: rgba(8, 17, 32, 0.88);
      --bg-card-border: rgba(0, 180, 255, 0.28);
      --bg-input: rgba(4, 12, 24, 0.85);
      --blue-electric: #0066FF;
      --blue-vibrant: #0084FF;
      --cyan-neon: #00D4FF;
      --cyan-glow: rgba(0, 212, 255, 0.4);
      --blue-glow: rgba(0, 102, 255, 0.45);
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --success: #10B981;
      --danger: #EF4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      font-family: var(--font-primary);
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fundo dinâmico com iluminação neon cyber-automotiva */
    body {
      background:
        radial-gradient(circle at 50% 12%, rgba(0, 102, 255, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 50% 88%, rgba(0, 212, 255, 0.16) 0%, transparent 60%),
        linear-gradient(180deg, #02060E 0%, #050B14 50%, #02060E 100%);
      position: relative;
    }

    /* Linhas e grade geométrica sutil ao fundo (estilo do ícone) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 102, 255, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 1;
    }

    /* Feixes de luz angular inspirados no ícone */
    body::after {
      content: "";
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 120vw;
      height: 120vw;
      max-width: 800px;
      max-height: 800px;
      border: 1px solid rgba(0, 212, 255, 0.06);
      box-shadow: 0 0 100px rgba(0, 102, 255, 0.08);
      pointer-events: none;
      z-index: 1;
    }

    /* Container Principal */
    .dna-auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0;
      box-sizing: border-box;
    }

    /* Gerenciamento de Telas com Transição Fluida */
    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.98) translateY(6px);
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    .screen.active {
      display: flex;
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Telas de formulário com card (Esqueci Senha) */
    #screen-forgot {
      padding: clamp(16px, 3vh, 28px) 16px;
      min-height: 100vh;
      min-height: 100dvh;
      justify-content: center;
    }

    /* ═════════════════════════════════════════════════════════════════════
       01. TELAS COM IMAGEM DE FUNDO WALLPAPER (SPLASH, LOGIN & CADASTRO OFICIAL)
       ═════════════════════════════════════════════════════════════════════ */
    #screen-splash,
    #screen-login,
    #screen-register {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      justify-content: flex-start;
      background: #010A16;
      background: linear-gradient(180deg, #010C1A 0%, #010712 40%, #000812 100%);
    }

    #screen-splash.active,
    #screen-login.active {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    #screen-register.active {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    #screen-splash.active,
    #screen-login.active {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .splash-layout {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
      background: #010A16;
      background: linear-gradient(180deg, #010C1A 0%, #010712 40%, #000812 100%);
    }

    /* Imagem de Fundo Oficial do DNA AUTO (Enquadramento perfeito sem cortes em qualquer tela) */
    .splash-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Gradiente suave inferior para assegurar legibilidade e contraste dos botões/campos sem cobrir o veículo */
    .splash-bottom-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 160px;
      background: linear-gradient(to top, rgba(1, 10, 22, 0.92) 0%, rgba(1, 10, 22, 0.45) 60%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Ações da Splash: 2 Botões com Safe-Area para Celular */
    .splash-actions {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 390px;
      padding: 0 20px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 12px));
      margin-bottom: clamp(16px, 2.5vh, 28px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }

    /* ═════════════════════════════════════════════════════════════════════
       FORMULÁRIO DA TELA DE LOGIN (MODELO EXATO DA REFERÊNCIA)
       ═════════════════════════════════════════════════════════════════════ */
    .login-form-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 390px;
      padding: 0 20px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 12px));
      margin-bottom: clamp(16px, 2.5vh, 28px);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .login-fields-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Pílula de Input Cyberpunk (Campos E-mail e Senha) */
    .cyber-input-pill {
      width: 100%;
      height: 54px;
      min-height: 54px;
      border-radius: 16px;
      background: rgba(3, 14, 30, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid #0099FF;
      box-shadow: 
        0 0 16px rgba(0, 153, 255, 0.2),
        inset 0 0 10px rgba(0, 153, 255, 0.08);
      display: flex;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      position: relative;
    }

    .cyber-input-pill:focus-within {
      border-color: #00D4FF;
      box-shadow: 
        0 0 24px rgba(0, 212, 255, 0.45),
        inset 0 0 14px rgba(0, 212, 255, 0.15);
      background: rgba(4, 18, 38, 0.9);
    }

    /* Ícone à Esquerda */
    .pill-icon-left {
      width: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00D4FF;
      flex-shrink: 0;
    }

    /* Divisor Vertical Interno */
    .pill-divider {
      width: 1px;
      height: 24px;
      background: rgba(0, 180, 255, 0.4);
      flex-shrink: 0;
    }

    /* Campo de Texto Interno */
    .pill-input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-family: var(--font-primary);
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      padding: 0 14px;
      box-sizing: border-box;
    }

    .pill-input::placeholder {
      color: #7E9EBE;
      font-size: 15px;
      font-weight: 400;
      opacity: 1;
    }

    /* Ícone Toggle Senha à Direita */
    .pill-icon-right {
      width: 46px;
      min-width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00B4D8;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.2s, transform 0.2s;
    }

    .pill-icon-right:hover {
      color: #00F0FF;
      transform: scale(1.08);
    }

    /* Linha de Opções (Lembrar de mim / Esqueceu a senha) */
    .login-options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 2px 4px 6px 4px;
      box-sizing: border-box;
    }

    /* Checkbox Estilizado */
    .remember-checkbox-label {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
    }

    .cyber-checkbox {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .custom-checkbox {
      width: 17px;
      height: 17px;
      min-width: 17px;
      border: 1.5px solid #0099FF;
      border-radius: 4px;
      background: rgba(3, 14, 30, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-sizing: border-box;
      position: relative;
    }

    .cyber-checkbox:checked ~ .custom-checkbox {
      background: #0084FF;
      border-color: #00D4FF;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
    }

    .cyber-checkbox:checked ~ .custom-checkbox::after {
      content: "";
      width: 4px;
      height: 8px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    .remember-text {
      color: #B5CEE6;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    /* Link Esqueceu a Senha */
    .forgot-link {
      color: #00A3FF;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }

    .forgot-link:hover {
      color: #38C7FF;
      text-shadow: 0 0 12px rgba(0, 180, 255, 0.6);
    }

    /* Botões Padrão DNA AUTO */
    .btn {
      width: 100%;
      height: 52px;
      min-height: 52px;
      border-radius: var(--radius-pill);
      font-family: var(--font-primary);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Botão 1: ENTRAR (Azul Elétrico Neon Primário) */
    .btn-entrar {
      background: linear-gradient(135deg, #0084FF 0%, #0055D4 100%);
      color: #FFFFFF;
      box-shadow: 
        0 6px 24px rgba(0, 102, 255, 0.55),
        0 0 0 1px rgba(0, 212, 255, 0.4) inset;
      position: relative;
      overflow: hidden;
    }

    .btn-entrar::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: 0.5s;
    }

    .btn-entrar:hover {
      box-shadow: 
        0 8px 30px rgba(0, 132, 255, 0.75),
        0 0 0 1.5px rgba(0, 212, 255, 0.6) inset;
      transform: translateY(-1px);
    }

    .btn-entrar:hover::before {
      left: 100%;
    }

    /* Botão Entrar específico da tela de login (Raio de curvatura igual ao design de referência) */
    .btn-entrar-login {
      height: 54px;
      min-height: 54px;
      border-radius: 16px;
      font-size: 16.5px;
      box-shadow: 
        0 8px 28px rgba(0, 102, 255, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* Botão 2: CADASTRAR (Contorno Neon Cyan Glassmorphism) */
    .btn-cadastrar {
      background: rgba(3, 12, 26, 0.82);
      border: 2px solid var(--cyan-neon);
      color: #FFFFFF;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.55),
        0 0 16px rgba(0, 212, 255, 0.2),
        inset 0 0 12px rgba(0, 212, 255, 0.12);
    }

    .btn-cadastrar:hover {
      background: rgba(0, 180, 255, 0.16);
      box-shadow: 
        0 6px 26px rgba(0, 212, 255, 0.42),
        inset 0 0 16px rgba(0, 212, 255, 0.22);
      transform: translateY(-1px);
    }

    /* Botão Voltar Discreto no Topo Esquerdo da Tela de Login */
    .login-back-btn {
      position: absolute;
      top: clamp(16px, 2.8vh, 26px);
      left: clamp(16px, 3.5vw, 22px);
      z-index: 25;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(3, 12, 26, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: #00D4FF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    .login-back-btn:hover {
      background: rgba(0, 212, 255, 0.2);
      border-color: #00D4FF;
      transform: translateX(-2px);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.4);
    }

    /* Ajuste de Proporção para Celular e Desktop */
    @media (min-width: 601px) {
      body {
        align-items: center;
        justify-content: center;
      }

      #screen-splash.active,
      #screen-login.active {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #screen-splash .splash-layout,
      #screen-login .splash-layout {
        width: 100%;
        max-width: 440px;
        height: min(920px, calc(100dvh - 32px));
        border-radius: 36px;
        border: 1px solid rgba(0, 212, 255, 0.25);
        box-shadow: 
          0 25px 70px rgba(0, 0, 0, 0.9),
          0 0 50px rgba(0, 102, 255, 0.3);
      }
    }

    @media (max-width: 600px) {
      .dna-auth-container {
        width: 100vw;
        max-width: 100vw;
        padding: 0;
      }

      #screen-splash,
      #screen-login {
        width: 100vw;
        max-width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
      }

      #screen-splash .splash-layout,
      #screen-login .splash-layout {
        width: 100%;
        max-width: 100%;
        height: 100%;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .splash-actions,
      .login-form-container {
        width: 100%;
        max-width: 100%;
        padding: 0 20px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 12px));
        margin-bottom: 12px;
      }

      .btn {
        height: 52px;
        min-height: 52px;
        font-size: 16px;
      }
    }

    /* ═════════════════════════════════════════════════════════════════════
       02. CARD FLUTUANTE DE LOGIN E CADASTRO (GLASSMORPHISM CYBER)
       ═════════════════════════════════════════════════════════════════════ */
    .auth-card-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .auth-card {
      width: 100%;
      background: linear-gradient(180deg, rgba(8, 17, 34, 0.94) 0%, rgba(4, 10, 22, 0.98) 100%);
      border: 1px solid rgba(0, 180, 255, 0.28);
      border-radius: 24px;
      padding: clamp(24px, 3.8vh, 32px) clamp(20px, 3.5vw, 26px);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(0, 102, 255, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      position: relative;
    }

    /* Barra Superior com botão voltar DISCRETO e mini badge */
    .auth-top-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    /* Botão Voltar Discreto: Compacto, Redondo e Minimalista (sem texto gigante) */
    .btn-back-discrete {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0;
      margin: 0;
      outline: none;
      box-shadow: none;
      flex-shrink: 0;
    }

    .btn-back-discrete:hover {
      background: rgba(0, 212, 255, 0.14);
      color: #00D4FF;
      border-color: rgba(0, 212, 255, 0.45);
      transform: translateX(-2px);
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.3);
    }

    .btn-back-discrete:active {
      transform: scale(0.92);
    }

    .mini-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-badge img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0, 212, 255, 0.6));
    }

    .mini-badge span {
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }

    .mini-badge span b {
      color: var(--cyan-neon);
    }

    /* Cabeçalho do Formulário */
    .auth-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
      text-align: left;
    }

    .auth-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
      line-height: 1.4;
      text-align: left;
    }

    /* Alerta de Erro */
    .auth-alert-box {
      display: none;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid var(--danger);
      color: #FCA5A5;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      margin-bottom: 18px;
      text-align: left;
      line-height: 1.4;
      animation: shake 0.3s ease-in-out;
    }

    /* Campos de Formulário */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      letter-spacing: 0.2px;
    }

    .form-link-sm {
      font-size: 12px;
      color: var(--cyan-neon);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }

    .form-link-sm:hover {
      text-decoration: underline;
      color: #70E0FF;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-dim);

</head>

<body>
  <div class="dna-auth-container">

    <!-- ══════════════════════════════════════════════════════════════════
         01. TELA DE BOAS-VINDAS / SPLASH SCREEN (OFICIAL DNA AUTO)
         ══════════════════════════════════════════════════════════════════ -->
    <section id="screen-splash" class="screen active">
      <div class="splash-layout">
        
        <!-- Nova imagem de fundo oficial enviada pelo usuário (sem distorção) -->
        <img
          src="/img/dna-auth-splash.png"
          alt="DNA AUTO — Seu veículo sempre protegido"
          class="splash-bg-img"
        />

        <!-- Gradiente suave inferior para assegurar legibilidade dos botões -->
        <div class="splash-bottom-gradient"></div>

        <!-- Botões de Acesso (Entrar e Cadastrar) perfeitamente posicionados para toque em celular -->
        <nav class="splash-actions" aria-label="Acesso ao DNA AUTO">
          <button
            class="btn btn-entrar"
            id="btnEntrar"
            type="button"
            onclick="entrar()"
          >
            <span>Entrar</span>
          </button>

          <button
            class="btn btn-cadastrar"
            id="btnCadastrar"
            type="button"
            onclick="cadastrar()"
          >
            <span>Cadastrar</span>
          </button>
        </nav>

      </div>
    </section>

    <!-- ══════════════════════════════════════════════════════════════════
         02. TELA DO FLUXO DE LOGIN ("ENTRAR NO DNA AUTO" - MODELO OFICIAL)
         ══════════════════════════════════════════════════════════════════ -->
    <section id="screen-login" class="screen">
      <div class="splash-layout">
        
        <!-- Imagem de fundo oficial enviada pelo usuário -->
        <img
          src="/img/dna-auth-splash.png"
          alt="DNA AUTO — Login"
          class="splash-bg-img"
        />

        <!-- Botão voltar discreto no topo esquerdo para retornar à splash -->
        <button class="login-back-btn" type="button" onclick="voltar()" aria-label="Voltar para tela inicial" title="Voltar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </button>

        <!-- Gradiente suave inferior para assegurar legibilidade dos campos -->
        <div class="splash-bottom-gradient"></div>

        <!-- Formulário de Login Posicionado sobre o Solo (Modelo Exato da Foto) -->
        <div class="login-form-container">
          <div id="login-error-box" class="auth-alert-box" style="display:none;"></div>

          <form id="form-login" onsubmit="handleLogin(event)" class="login-fields-form">
            
            <!-- Campo 1: E-mail ou CPF -->
            <div class="cyber-input-pill">
              <div class="pill-icon-left">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <div class="pill-divider"></div>
              <input
                id="login-email"
                class="pill-input"
                type="text"
                placeholder="E-mail ou CPF"
                required
                autocomplete="username"
              />
            </div>

            <!-- Campo 2: Senha -->
            <div class="cyber-input-pill">
              <div class="pill-icon-left">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <div class="pill-divider"></div>
              <input
                id="login-password"
                class="pill-input"
                type="password"
                placeholder="Senha"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="pill-icon-right btn-toggle-pass"
                onclick="togglePass('login-password')"
                aria-label="Mostrar ou ocultar senha"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <!-- Linha de Opções: Lembrar de mim & Esqueceu a senha -->
            <div class="login-options-row">
              <label class="remember-checkbox-label">
                <input type="checkbox" id="remember-me" checked class="cyber-checkbox" />
                <span class="custom-checkbox"></span>
                <span class="remember-text">Lembrar de mim</span>
              </label>
              <a class="forgot-link" href="javascript:void(0)" onclick="esqueciSenha()">Esqueceu a senha?</a>
            </div>

            <!-- Botão Entrar -->
            <button id="btn-submit-login" class="btn btn-entrar btn-entrar-login" type="submit">
              <span>Entrar</span>
            </button>

            <!-- Link para Cadastro (Sem Demo 1-Clique) -->
            <div style="display: flex; justify-content: center; align-items: center; margin-top: 14px; padding: 0 4px; font-size: 13.5px;">
              <a href="javascript:void(0)" onclick="cadastrar()" style="color: #00D4FF; font-weight: 600; text-decoration: none;">Não tem uma conta? Criar cadastro</a>
            </div>

          </form>
        </div>

      </div>
    </section>

    <!-- ══════════════════════════════════════════════════════════════════
         03. TELA DO FLUXO DE CADASTRO ("CRIAR CADASTRO" - MODELO OFICIAL)
         ══════════════════════════════════════════════════════════════════ -->
    <section id="screen-register" class="screen">
      <div class="splash-layout register-layout">
        <!-- Imagem de Fundo Oficial Wallpaper Fixa -->
        <div class="splash-bg-fixed"></div>

        <!-- Barra Superior com Botão Voltar Discreto e Identidade Visual DNA AUTO -->
        <div class="register-header-bar">
          <button class="login-back-btn" type="button" onclick="voltar()" aria-label="Voltar para início" title="Voltar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <div class="brand-top-pill register-brand-pill">
            <img src="/img/dna-logo-aura.png" class="register-logo-img" alt="DNA AUTO" onerror="this.src='/img/splash-d-logo.png';" />
            <span class="register-logo-text">DNA <b style="color:#00D4FF;">AUTO</b></span>
          </div>
        </div>

        <!-- Formulário de Cadastro Cyberpunk com Pílulas e Auditoria Cadastral -->
        <div class="register-form-container">
          <div class="register-title-box">
            <h1 class="register-title">Criar cadastro</h1>
            <p class="register-subtitle">Junte-se à rede de proteção e certificação veicular DNA AUTO</p>
          </div>

          <div id="reg-error-box" class="auth-alert-box" style="display:none;"></div>

          <form id="form-register" onsubmit="handleRegister(event)" class="register-fields-form">
            <!-- Placa do Veículo com Verificação Oficial -->
            <div class="form-field-group">
              <div class="field-label-row">
                <label class="cyber-label" for="reg-placa">Placa do Veículo</label>
                <button type="button" class="cyber-badge-official" onclick="triggerPlateSearch(document.getElementById('reg-placa').value)" title="Puxar dados oficiais">
                  <span class="pulse-dot"></span>
                  <span>Puxar dados oficiais</span>
                </button>
              </div>
              <div class="cyber-input-pill plate-input-pill">
                <div class="pill-plate-flag">
                  <span class="flag-br-badge">BR</span>
                </div>
                <div class="pill-divider"></div>
                <input
                  id="reg-placa"
                  class="pill-input plate-cyber-input"
                  type="text"
                  placeholder="BRA2E19"
                  maxlength="7"
                  autocomplete="off"
                  oninput="handlePlateInput(this)"
                  onblur="triggerPlateSearch(this.value)"
                />
                <div id="plate-search-indicator" class="plate-indicator-box"></div>
              </div>
              <span class="cyber-helper-text">Digite a placa para carregar os dados cadastrais do seu carro.</span>
            </div>

            <!-- Card Dinâmico de Auditoria Cadastral (HUD Checklist Bars com Todos os Dados) -->
            <div id="reg-vehicle-card" style="display:none;"></div>

            <!-- Nome Completo -->
            <div class="form-field-group">
              <label class="cyber-label" for="reg-nome">Nome Completo</label>
              <div class="cyber-input-pill">
                <div class="pill-icon-left">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
                <div class="pill-divider"></div>
                <input
                  id="reg-nome"
                  class="pill-input"
                  type="text"
                  placeholder="Seu nome completo"
                  required
                  autocomplete="name"
                />
              </div>
            </div>

            <!-- E-mail -->
            <div class="form-field-group">
              <label class="cyber-label" for="reg-email">E-mail</label>
              <div class="cyber-input-pill">
                <div class="pill-icon-left">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                  </svg>
                </div>
                <div class="pill-divider"></div>
                <input
                  id="reg-email"
                  class="pill-input"
                  type="email"
                  placeholder="seu@email.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <!-- WhatsApp (para alertas de revisão) -->
            <div class="form-field-group">
              <label class="cyber-label" for="reg-whatsapp">WhatsApp (para alertas de revisão)</label>
              <div class="cyber-input-pill">
                <div class="pill-icon-left">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                  </svg>
                </div>
                <div class="pill-divider"></div>
                <input
                  id="reg-whatsapp"
                  class="pill-input"
                  type="tel"
                  placeholder="(11) 99999-9999"
                  autocomplete="tel"
                  oninput="maskPhone(this)"
                />
              </div>
            </div>

            <!-- Senha -->
            <div class="form-field-group">
              <label class="cyber-label" for="reg-senha">Senha</label>
              <div class="cyber-input-pill">
                <div class="pill-icon-left">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </div>
                <div class="pill-divider"></div>
                <input
                  id="reg-senha"
                  class="pill-input"
                  type="password"
                  placeholder="Mínimo 6 caracteres"
                  required
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="pill-icon-right btn-toggle-pass"
                  onclick="togglePass('reg-senha')"
                  aria-label="Mostrar ou ocultar senha"
                  title="Mostrar/ocultar senha"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Botão Criar Minha Conta -->
            <button id="btn-submit-register" class="btn btn-entrar btn-entrar-login" type="submit" style="margin-top: 8px;">
              <span>Criar Minha Conta</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="19" y1="8" x2="19" y2="14"></line>
                <line x1="22" y1="11" x2="16" y2="11"></line>
              </svg>
            </button>

            <!-- Link para Fazer Login -->
            <div style="display: flex; justify-content: center; align-items: center; margin-top: 14px; padding: 0 4px; font-size: 13.5px;">
              <span style="color: #94A3B8; margin-right: 6px;">Já possui uma conta?</span>
              <a href="javascript:void(0)" onclick="entrar()" style="color: #00D4FF; font-weight: 700; text-decoration: none;">Fazer Login</a>
            </div>
          </form>
        </div>
      </div>
    </section>

  </div>

  <script>
    // ── Transição de Telas ──
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(el => {
        el.classList.remove('active');
      });
      const target = document.getElementById('screen-' + name);
      if (target) {
        target.classList.add('active');
        if (window.location.hash !== '#' + name) {
          window.location.hash = '#' + name;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function entrar() {
      showScreen('login');
    }

    function cadastrar() {
      showScreen('register');
    }

    function voltar() {
      showScreen('splash');
    }

    // ── Alternar Visibilidade da Senha ──
    function togglePass(id) {
      const input = document.getElementById(id);
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
      }
    }

    // ── Máscara de Telefone ──
    function maskPhone(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 11) v = v.substring(0, 11);
      if (v.length > 10) {
        input.value = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      } else if (v.length > 6) {
        input.value = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
      } else if (v.length > 2) {
        input.value = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
      } else {
        input.value = v;
      }
    }

    // ── Busca de Placa Dinâmica com o Sistema DNA AUTO ──
    let plateDebounce = null;
    let lastCheckedPlate = '';
    let currentFoundVehicle = null;

    function handlePlateInput(input) {
      let v = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v.length > 7) v = v.substring(0, 7);
      input.value = v;

      const card = document.getElementById('reg-vehicle-card');
      const indicator = document.getElementById('plate-search-indicator');

      if (v.length < 7) {
        if (card) card.style.display = 'none';
        if (indicator) indicator.innerHTML = '';
        currentFoundVehicle = null;
        return;
      }

      if (v.length === 7 && v !== lastCheckedPlate) {
        clearTimeout(plateDebounce);
        plateDebounce = setTimeout(() => {
          triggerPlateSearch(v);
        }, 350);
      }
    }

    async function triggerPlateSearch(plate) {
      const cleanPlate = (plate || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (cleanPlate.length !== 7) return;
      lastCheckedPlate = cleanPlate;

      const indicator = document.getElementById('plate-search-indicator');
      const card = document.getElementById('reg-vehicle-card');

      if (indicator) {
        indicator.innerHTML = '<div class="spinner-neon" style="width:18px; height:18px; border:2px solid rgba(0,212,255,0.2); border-top-color:#00D4FF; border-radius:50%; animation:spin 0.7s linear infinite;" title="Consultando base oficial..."></div>';
      }

      try {
        const res = await fetch(`/api/v1/integrations/plate-lookup/${cleanPlate}`);
        const data = await res.json();

        if (!res.ok || !data.found || !data.vehicle) {
          if (indicator) {
            indicator.innerHTML = `
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" title="Veículo não localizado">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
            `;
          }
          if (card) {
            card.style.display = 'block';
            card.innerHTML = `
              <div class="cyber-verification-hud" style="border-color: rgba(239, 68, 68, 0.4); background: rgba(20, 10, 15, 0.92);">
                <div class="hud-header">
                  <div class="hud-status-badge" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #EF4444;">
                    <span style="width:6px; height:6px; border-radius:50%; background:#EF4444;"></span>
                    <span>PLACA NÃO LOCALIZADA</span>
                  </div>
                  <span class="hud-origin-tag">Base Nacional Oficial</span>
                </div>
                <div style="padding: 16px 14px; text-align: center;">
                  <p style="font-size: 13.5px; color: #FCA5A5; font-weight: 700; margin-bottom: 5px;">Veículo não localizado na Base Nacional Oficial</p>
                  <p style="font-size: 12px; color: #94A3B8; line-height: 1.4;">A placa <strong style="color:#FFF;">${cleanPlate}</strong> não foi encontrada nos registros oficiais. Verifique se digitou os 7 caracteres corretamente.</p>
                </div>
              </div>
            `;
          }
          currentFoundVehicle = null;
          return;
        }

        const v = data.vehicle;
        currentFoundVehicle = v;

        const brand = v.brand || (v.specs && v.specs.marca) || 'Veículo';
        const model = v.model || (v.specs && v.specs.modelo) || '';
        const version = v.version || v.version_label || (v.specs && v.specs.versao) || `${brand} ${model}`;
        const yearFab = v.manufacture_year || (v.specs && v.specs.ano_fabricacao) || '---';
        const yearMod = v.model_year || (v.specs && v.specs.ano_modelo) || '---';
        const color = (v.color && v.color !== 'Não informada') ? v.color : ((v.specs && v.specs.cor) || 'Não informada');
        const fuel = v.fuel_type || (v.specs && v.specs.combustivel) || 'Não informado';
        const displacement = v.engine_displacement || (v.specs && v.specs.cilindradas_formatada) || '';
        const chassi = v.chassis_vin_masked || v.chassis_vin || (v.specs && v.specs.chassi) || 'Auditado pela base';

        let fipeFormatted = 'Não informada pela Tabela FIPE';
        let fipeCode = '---';
        let refMonth = 'Mês vigente';

        if (v.fipe) {
          if (v.fipe.market_value_formatted) fipeFormatted = v.fipe.market_value_formatted;
          else if (v.fipe_price_cents) fipeFormatted = (v.fipe_price_cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
          if (v.fipe.fipe_code) fipeCode = v.fipe.fipe_code;
          if (v.fipe.reference_month) refMonth = v.fipe.reference_month;
        } else if (v.fipe_price_cents) {
          fipeFormatted = (v.fipe_price_cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        const city = (v.origin && v.origin.city) || (v.specs && v.specs.municipio) || v.city || 'Origem nacional';
        const state = (v.origin && v.origin.state) || (v.specs && v.specs.uf) || v.state || 'BR';
        const country = (v.origin && v.origin.country) || (v.specs && v.specs.nacionalidade) || 'Nacional';
        const vehicleType = v.vehicle_type || (v.specs && v.specs.tipo_veiculo) || 'Automóvel';
        const situacao = (v.legal_status && v.legal_status.detran_status) || (v.specs && v.specs.situacao_veiculo) || 'Regular • Registro Ativo';

        if (indicator) {
          indicator.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" title="Veículo 100% Auditado">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          `;
        }

        if (card) {
          card.style.display = 'block';
          card.innerHTML = `
            <div class="cyber-verification-hud">
              <div class="hud-header">
                <div class="hud-status-badge">
                  <span class="hud-pulse-radar"></span>
                  <span>AUDITORIA CADASTRAL HOMOLOGADA</span>
                </div>
                <span class="hud-origin-tag">Base Nacional Oficial</span>
              </div>

              <div class="hud-hero-box">
                <div class="hud-hero-info">
                  <div class="hud-plate-tag">
                    <span class="hud-br-flag">BR</span>
                    <span class="hud-plate-code">${cleanPlate}</span>
                  </div>
                  <div class="hud-hero-titles">
                    <h3 class="hud-car-title">${brand} ${model}</h3>
                    <p class="hud-car-version">${version}</p>
                  </div>
                </div>
                <div class="hud-fipe-badge">
                  <span class="fipe-label">VALOR TABELA FIPE OFICIAL</span>
                  <span class="fipe-value">${fipeFormatted}</span>
                  <span class="fipe-ref">Referência: ${refMonth}</span>
                </div>
              </div>

              <div class="hud-checklist-bars">
                <!-- 1. Placa -->
                <div class="check-bar-item done">
                  <div class="check-icon-box">✓</div>
                  <div class="check-content">
                    <div class="check-row-top">
                      <span class="check-label">Placa do Veículo</span>
                      <span class="check-status-badge">Validada</span>
                    </div>
                    <div class="check-value">${cleanPlate} • Padrão Mercosul / Registro Nacional</div>
                  </div>
                </div>

                <!-- 2. Chassi & VIN -->
                <div class="check-bar-item done">
                  <div class="check-icon-box">✓</div>
                  <div class="check-content">
                    <div class="check-row-top">
                      <span class="check-label">Chassi & Identificação VIN</span>
                      <span class="check-status-badge">Auditado</span>
                    </div>
                    <div class="check-value">${chassi} • Numeração de Fábrica Conforme</div>
                  </div>
                </div>

                <!-- 3. Ano e Fabricação -->
                <div class="check-bar-item done">
                  <div class="check-icon-box">✓</div>
                  <div class="check-content">
                    <div class="check-row-top">
                      <span class="check-label">Ano de Fabricação / Modelo</span>
                      <span class="check-status-badge">Homologado</span>
                    </div>
                    <div class="check-value">${yearFab} / ${yearMod} • Procedência: ${country}</div>
                  </div>
                </div>

                <!-- 4. Tabela FIPE -->
                <div class="check-bar-item done">
                  <div class="check-icon-box">✓</div>
                  <div class="check-content">
                    <div class="check-row-top">
                      <span class="check-label">Valor de Mercado FIPE Oficial</span>
                      <span class="check-status-badge highlight-green">Confirmado</span>
                    </div>
                    <div class="check-value fipe-highlight">${fipeFormatted} • Código FIPE: ${fipeCode}</div>
                  </div>
                </div>

                <!-- 5. Cor & Motor -->
                <div class="check-bar-item done">
                  <div class="check-icon-box">✓</div>
                  <div class="check-content">
                    <div class="check-row-top">
                      <span class="check-label">Cor & Motorização</span>
                      <span class="check-status-badge">Certificado</span>
                    </div>
                    <div class="check-value">${color} • ${fuel} ${displacement ? '• ' + displacement : ''}</div>
                  </div>
                </div>

                <!-- 6. Modelo & Categoria -->
                <div class="check-bar-item done">
                  <div class="check-icon-box">✓</div>
                  <div class="check-content">
                    <div class="check-row-top">
                      <span class="check-label">Modelo & Categoria</span>
                      <span class="check-status-badge">Catalogado</span>
                    </div>
                    <div class="check-value">${brand} ${model} • ${vehicleType}</div>
                  </div>
                </div>

                <!-- 7. Situação Cadastral -->
                <div class="check-bar-item done">
                  <div class="check-icon-box">✓</div>
                  <div class="check-content">
                    <div class="check-row-top">
                      <span class="check-label">Situação Cadastral & Emplacamento</span>
                      <span class="check-status-badge highlight-blue">Regular</span>
                    </div>
                    <div class="check-value">${city} - ${state} • ${situacao}</div>
                  </div>
                </div>
              </div>

              <div class="hud-footer-success">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="2.5">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Veículo 100% auditado na base oficial e apto para certificação DNA AUTO.</span>
              </div>
            </div>
          `;
        }
      } catch (err) {
        if (indicator) indicator.innerHTML = '';
      }
    }

    // ── Esqueci Minha Senha ──
    function esqueciSenha() {
      const email = document.getElementById('login-email')?.value || '';
      alert(email ? `Instruções de recuperação foram enviadas para o e-mail: ${email}` : 'Informe seu e-mail para receber as instruções de recuperação.');
    }

    // ── Processar Login ──
    async function handleLogin(e) {
      e.preventDefault();
      const email = (document.getElementById('login-email')?.value || '').trim();
      const password = (document.getElementById('login-password')?.value || '').trim();
      const errBox = document.getElementById('login-error-box');
      const btn = document.getElementById('btn-submit-login');

      if (!email || !password) {
        errBox.innerText = 'Informe seu e-mail e senha de acesso.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>Entrando na Garagem...</span>';
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('dna_token', data.token);
          localStorage.setItem('dna_auto_token', data.token);
          if (data.user) {
            localStorage.setItem('dna_logged_user', JSON.stringify(data.user));
            if (data.user.name) {
              localStorage.setItem('dna_user_name', data.user.name);
            }
            if (data.user.vehicle && data.user.vehicle.license_plate) {
              localStorage.setItem('dna_registered_plate', data.user.vehicle.license_plate);
            }
          }
          localStorage.setItem('dna_owner_session', 'active');
          localStorage.setItem('dna_owner_auth_screen', 'app');
          localStorage.setItem('dna_owner_current_screen', 'home');
          window.location.href = '/cliente';
        } else {
          errBox.innerText = data.error || 'Credenciais inválidas. Verifique seu e-mail e senha.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<span>Entrar</span>';
        }
      } catch (err) {
        errBox.innerText = 'Falha ao conectar ao servidor. Tente novamente.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Entrar</span>';
      }
    }

    // ── Processar Cadastro com Placa Dinâmica ──
    async function handleRegister(e) {
      e.preventDefault();
      const name = (document.getElementById('reg-nome')?.value || '').trim();
      const email = (document.getElementById('reg-email')?.value || '').trim();
      const password = (document.getElementById('reg-senha')?.value || '').trim();
      const phone = (document.getElementById('reg-whatsapp')?.value || '').trim();
      const plate = (document.getElementById('reg-placa')?.value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      const errBox = document.getElementById('reg-error-box');
      const btn = document.getElementById('btn-submit-register');

      if (!name || !email || !password) {
        errBox.innerText = 'Preencha todos os campos obrigatórios (Nome, E-mail e Senha).';
        errBox.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errBox.innerText = 'A senha deve conter no mínimo 6 caracteres.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>Criando cadastro e vinculando veículo...</span>';
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/v1/auth/register-client', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, phone, plate })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('dna_token', data.token);
          localStorage.setItem('dna_auto_token', data.token);
          if (plate) {
            localStorage.setItem('dna_registered_plate', plate);
          }
          if (data.user) {
            localStorage.setItem('dna_logged_user', JSON.stringify(data.user));
            if (data.user.name) {
              localStorage.setItem('dna_user_name', data.user.name);
            }
            if (data.user.vehicle && data.user.vehicle.license_plate) {
              localStorage.setItem('dna_registered_plate', data.user.vehicle.license_plate);
            }
          }
          localStorage.setItem('dna_owner_session', 'active');
          localStorage.setItem('dna_owner_auth_screen', 'app');
          localStorage.setItem('dna_owner_current_screen', 'home');
          window.location.href = '/cliente';
        } else {
          errBox.innerText = data.error || 'Erro ao criar cadastro. Tente novamente.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = `
            <span>Criar Minha Conta</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
          `;
        }
      } catch (err) {
        errBox.innerText = 'Falha ao conectar ao servidor. Tente novamente.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = `
          <span>Criar Minha Conta</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <line x1="19" y1="8" x2="19" y2="14"></line>
            <line x1="22" y1="11" x2="16" y2="11"></line>
          </svg>
        `;
      }
    }

    // ── Sincronização de Histórico e Hash ──
    window.addEventListener('hashchange', () => {
      const hash = (window.location.hash || '').replace('#', '').toLowerCase();
      if (hash === 'login') showScreen('login');
      else if (hash === 'register') showScreen('register');
      else showScreen('splash');
    });

    window.addEventListener('DOMContentLoaded', () => {
      const hash = (window.location.hash || '').replace('#', '').toLowerCase();
      if (hash === 'login') showScreen('login');
      else if (hash === 'register') showScreen('register');
      else showScreen('splash');
    });
  </script>
</body>
</html>
