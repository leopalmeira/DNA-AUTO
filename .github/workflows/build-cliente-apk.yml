name: Build Android APKs (Cliente & Oficina)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL base da plataforma'
        required: true
        default: 'https://dna-auto-byin.onrender.com'
      version_name:
        description: 'Versão dos APKs (ex: 2.5.3)'
        required: true
        default: '2.5.3'
      version_code:
        description: 'Código inteiro da versão (ex: 253)'
        required: true
        default: '253'
  push:
    branches:
      - master
    paths:
      - 'android-client/**'
      - 'android-oficina/**'
      - 'scripts/patch-android.js'
      - '.github/workflows/build-cliente-apk.yml'

jobs:
  build-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK do Cliente (dna-auto-cliente.apk)
        working-directory: android-client
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url || 'https://dna-auto-byin.onrender.com' }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || '2.5.3' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || '253' }}
        run: |
          npm install
          npx cap add android
          npx cap sync android
          node ../scripts/patch-android.js cliente
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../dna-auto-cliente.apk

      - name: Compilar APK da Oficina (dna-auto-oficina.apk)
        working-directory: android-oficina
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url || 'https://dna-auto-byin.onrender.com' }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || '2.5.3' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || '253' }}
        run: |
          npm install
          npx cap add android
          npx cap sync android
          node ../scripts/patch-android.js oficina
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../dna-auto-oficina.apk

      - name: Extrair SHA-256 dos Certificados
        id: cert
        run: |
          SHA_CLIENTE=$(keytool -printcert -jarfile dna-auto-cliente.apk | grep "SHA256:" | head -n1 | sed 's/.*SHA256: *//')
          SHA_OFICINA=$(keytool -printcert -jarfile dna-auto-oficina.apk | grep "SHA256:" | head -n1 | sed 's/.*SHA256: *//')
          echo "SHA256 Cliente: $SHA_CLIENTE"
          echo "SHA256 Oficina: $SHA_OFICINA"
          echo "sha256_cliente=$SHA_CLIENTE" >> $GITHUB_OUTPUT
          echo "sha256_oficina=$SHA_OFICINA" >> $GITHUB_OUTPUT

      - name: Publicar Artifacts dna-auto-apks
        uses: actions/upload-artifact@v4
        with:
          name: dna-auto-apks
          path: |
            dna-auto-cliente.apk
            dna-auto-oficina.apk

      - name: Publicar Release Pública 'apk-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VNAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VNAME" ]; then VNAME="2.5.3"; fi
          gh release delete apk-latest --yes || true
          git push origin :refs/tags/apk-latest || true
          gh release create apk-latest dna-auto-cliente.apk dna-auto-oficina.apk \
            --title "DNA AUTO APKs v${VNAME}" \
            --notes "Binários APK Android compilados para App do Cliente e App da Oficina. Suporte a tela cheia edge-to-edge, GPS background e download automático direto da URL."
