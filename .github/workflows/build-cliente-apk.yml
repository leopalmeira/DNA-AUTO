name: Build Android APKs (Cliente & Oficina)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL base da plataforma'
        required: true
        default: 'https://dna-auto-byin.onrender.com'
      version_name:
        description: 'Versão dos APKs (ex: 2.5.6)'
        required: true
        default: '2.5.6'
      version_code:
        description: 'Código inteiro da versão (ex: 256)'
        required: true
        default: '256'
      oficina_version_name:
        description: 'Versão exclusiva do APK da Oficina'
        required: true
        default: '2.5.7'
      oficina_version_code:
        description: 'Código inteiro exclusivo do APK da Oficina'
        required: true
        default: '257'
  push:
    branches:
      - master
    paths:
      - 'android-client/**'
      - 'android-oficina/**'
      - 'scripts/patch-android.js'
      - 'scripts/dna-mileage-android.js'
      - '.github/workflows/build-cliente-apk.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'android-client/**'
      - 'scripts/patch-android.js'
      - 'scripts/dna-mileage-android.js'
      - '.github/workflows/build-cliente-apk.yml'

jobs:
  build-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK do Cliente (dna-auto-cliente.apk)
        working-directory: android-client
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url || 'https://dna-auto-byin.onrender.com' }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || '2.5.6' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || '256' }}
        run: |
          npm install
          node ../scripts/patch-android.js cliente --config-only
          npx cap add android
          npx cap sync android
          node ../scripts/patch-android.js cliente
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../dna-auto-cliente.apk

      - name: Compilar APK da Oficina (dna-auto-oficina.apk)
        working-directory: android-oficina
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url || 'https://dna-auto-byin.onrender.com' }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.oficina_version_name || '2.5.7' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.oficina_version_code || '257' }}
        run: |
          npm install
          node ../scripts/patch-android.js oficina --config-only
          npx cap add android
          npx cap sync android
          node ../scripts/patch-android.js oficina
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../dna-auto-oficina.apk

      # O APK debug muda a assinatura a cada runner. Nunca publicar debug como
      # atualização de produção: usar a MESMA chave privada em todos os builds.
      - name: Assinar APKs de produção com keystore persistente
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          DNA_ANDROID_KEYSTORE_BASE64: ${{ secrets.DNA_ANDROID_KEYSTORE_BASE64 }}
          DNA_ANDROID_STORE_PASSWORD: ${{ secrets.DNA_ANDROID_STORE_PASSWORD }}
          DNA_ANDROID_KEY_ALIAS: ${{ secrets.DNA_ANDROID_KEY_ALIAS }}
          DNA_ANDROID_KEY_PASSWORD: ${{ secrets.DNA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in DNA_ANDROID_KEYSTORE_BASE64 DNA_ANDROID_STORE_PASSWORD DNA_ANDROID_KEY_ALIAS DNA_ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret ${var} ausente. Não publicar APK com assinatura temporária."
              exit 1
            fi
          done
          printf '%s' "$DNA_ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/dna-auto-release.keystore
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          for item in cliente oficina; do
            pushd "android-$item/android" >/dev/null
            chmod +x gradlew
            ./gradlew assembleRelease
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$SRC" "../../dna-auto-$item-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/dna-auto-release.keystore \
              --ks-key-alias "$DNA_ANDROID_KEY_ALIAS" \
              --ks-pass env:DNA_ANDROID_STORE_PASSWORD \
              --key-pass env:DNA_ANDROID_KEY_PASSWORD \
              --out "../../dna-auto-$item.apk" "../../dna-auto-$item-aligned.apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "../../dna-auto-$item.apk"
            popd >/dev/null
            rm "dna-auto-$item-aligned.apk"
          done

      - name: Extrair SHA-256 dos Certificados
        id: cert
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          SHA_CLIENTE=$("$BUILD_TOOLS/apksigner" verify --print-certs dna-auto-cliente.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest/{print $2;exit}')
          SHA_OFICINA=$("$BUILD_TOOLS/apksigner" verify --print-certs dna-auto-oficina.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest/{print $2;exit}')
          test -n "$SHA_CLIENTE" && test -n "$SHA_OFICINA"
          echo "SHA256 Cliente: $SHA_CLIENTE"
          echo "SHA256 Oficina: $SHA_OFICINA"
          echo "sha256_cliente=$SHA_CLIENTE" >> $GITHUB_OUTPUT
          echo "sha256_oficina=$SHA_OFICINA" >> $GITHUB_OUTPUT

      - name: Publicar Artifacts dna-auto-apks
        uses: actions/upload-artifact@v4
        with:
          name: dna-auto-apks
          path: |
            dna-auto-cliente.apk
            dna-auto-oficina.apk

      - name: Publicar Release Pública 'apk-latest'
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VNAME="Cliente v${{ github.event.inputs.version_name || '2.5.6' }} / Oficina v${{ github.event.inputs.oficina_version_name || '2.5.7' }}"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest dna-auto-cliente.apk dna-auto-oficina.apk --clobber
            gh release edit apk-latest --title "DNA AUTO APKs — ${VNAME}" --notes "APKs assinados com keystore persistente. GPS em segundo plano com consentimento e alertas de hodômetro."
          else
            gh release create apk-latest dna-auto-cliente.apk dna-auto-oficina.apk \
              --title "DNA AUTO APKs — ${VNAME}" \
              --notes "APKs assinados com keystore persistente. GPS em segundo plano com consentimento e alertas de hodômetro."
          fi
