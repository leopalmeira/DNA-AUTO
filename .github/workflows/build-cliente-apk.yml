name: Build Android APKs (Cliente & Oficina)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL base da plataforma'
        required: true
        default: 'https://dna-auto-byin.onrender.com'
      version_name:
        description: 'Versão dos APKs (ex: 2.5.7)'
        required: true
        default: '2.5.7'
      version_code:
        description: 'Código inteiro da versão (ex: 257)'
        required: true
        default: '257'
      oficina_version_name:
        description: 'Versão exclusiva do APK da Oficina'
        required: true
        default: '2.5.9'
      oficina_version_code:
        description: 'Código inteiro exclusivo do APK da Oficina'
        required: true
        default: '259'
      migrate_legacy_signature:
        description: 'Permitir troca única da assinatura dos APKs legados (exige reinstalação)'
        type: boolean
        default: false
      cliente_update_required:
        description: 'Exibir atualização obrigatória do Cliente (somente APK novo assinado)'
        type: boolean
        required: false
        default: false
      oficina_update_required:
        description: 'Exibir atualização obrigatória da Oficina (somente APK novo assinado)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - master
    paths:
      - 'android-client/**'
      - 'android-oficina/**'
      - 'scripts/patch-android.js'
      - 'scripts/android/startup.mp4'
      - 'scripts/dna-mileage-android.js'
      - '.github/workflows/build-cliente-apk.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'android-client/**'
      - 'scripts/patch-android.js'
      - 'scripts/android/startup.mp4'
      - 'scripts/dna-mileage-android.js'
      - '.github/workflows/build-cliente-apk.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK do Cliente (dna-auto-cliente.apk)
        working-directory: android-client
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url || 'https://dna-auto-byin.onrender.com' }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || '2.5.7' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || '257' }}
        run: |
          npm install
          node ../scripts/patch-android.js cliente --config-only
          npx cap add android
          npx cap sync android
          node ../scripts/patch-android.js cliente
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../dna-auto-cliente.apk

      - name: Compilar APK da Oficina (dna-auto-oficina.apk)
        working-directory: android-oficina
        env:
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url || 'https://dna-auto-byin.onrender.com' }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.oficina_version_name || '2.5.9' }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.oficina_version_code || '259' }}
        run: |
          npm install
          node ../scripts/patch-android.js oficina --config-only
          npx cap add android
          npx cap sync android
          node ../scripts/patch-android.js oficina
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../dna-auto-oficina.apk

      # O APK debug muda a assinatura a cada runner. Nunca publicar debug como
      # atualização de produção: usar a MESMA chave privada em todos os builds.
      - name: Assinar APKs de produção com keystore persistente
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          DNA_ANDROID_TEST_SIGNING: ${{ secrets.DNA_ANDROID_TEST_SIGNING }}
        run: |
          set -euo pipefail
          if [ -z "$DNA_ANDROID_TEST_SIGNING" ]; then
            echo '::error::Secret DNA_ANDROID_TEST_SIGNING ausente.'
            exit 1
          fi
          umask 077
          KEYSTORE=$(mktemp "$RUNNER_TEMP/dna-auto-keystore.XXXXXX")
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$DNA_ANDROID_TEST_SIGNING" | jq -er '.keystore | strings | select(length > 0)' | base64 -d > "$KEYSTORE"
          DNA_ANDROID_SIGNING_PASSWORD=$(printf '%s' "$DNA_ANDROID_TEST_SIGNING" | jq -er '.password | strings | select(length > 0)')
          MASKED_PASSWORD=${DNA_ANDROID_SIGNING_PASSWORD//%/%25}
          MASKED_PASSWORD=${MASKED_PASSWORD//$'\r'/%0D}
          MASKED_PASSWORD=${MASKED_PASSWORD//$'\n'/%0A}
          printf '::add-mask::%s\n' "$MASKED_PASSWORD"
          export DNA_ANDROID_SIGNING_PASSWORD
          unset DNA_ANDROID_TEST_SIGNING MASKED_PASSWORD
          KEYSTORE_ENTRIES=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "$KEYSTORE" -storepass:env DNA_ANDROID_SIGNING_PASSWORD)
          mapfile -t KEY_ALIASES < <(awk '/^Alias name: / {alias = substr($0, 13)} /^Entry type: PrivateKeyEntry$/ {print alias}' <<< "$KEYSTORE_ENTRIES")
          if [ "${#KEY_ALIASES[@]}" -ne 1 ] || [ -z "${KEY_ALIASES[0]}" ]; then
            echo '::error::O arquivo de assinatura deve conter exatamente uma chave privada.'
            exit 1
          fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          for item in cliente oficina; do
            project=android-client
            if [ "$item" = oficina ]; then
              project=android-oficina
            fi
            pushd "$project/android" >/dev/null
            chmod +x gradlew
            ./gradlew assembleRelease
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$SRC" "../../dna-auto-$item-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "${KEY_ALIASES[0]}" \
              --ks-pass env:DNA_ANDROID_SIGNING_PASSWORD \
              --key-pass env:DNA_ANDROID_SIGNING_PASSWORD \
              --out "../../dna-auto-$item.apk" "../../dna-auto-$item-aligned.apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "../../dna-auto-$item.apk"
            popd >/dev/null
            rm "dna-auto-$item-aligned.apk"
          done

      # Assinatura Android é a identidade do app. Se mudar, atualizar sem desinstalar é impossível.
      # Apenas a migração explícita da release legada permite trocar a assinatura.
      - name: Garantir compatibilidade com assinatura dos APKs já publicados
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATE_LEGACY_SIGNATURE: ${{ inputs.migrate_legacy_signature }}
          CLIENTE_REQUIRED: ${{ inputs.cliente_update_required }}
          OFICINA_REQUIRED: ${{ inputs.oficina_update_required }}
        run: |
          set -euo pipefail
          if [ "$MIGRATE_LEGACY_SIGNATURE" = true ]; then
            if [ "$CLIENTE_REQUIRED" = true ] || [ "$OFICINA_REQUIRED" = true ]; then
              echo "::error::A migração da assinatura exige reinstalação manual. Desative a atualização obrigatória."
              exit 1
            fi
            ASSETS=$(gh release view apk-latest --json assets --jq '.assets[].name')
            if ! grep -Fxq dna-auto-cliente.apk <<< "$ASSETS" ||
               ! grep -Fxq dna-auto-oficina.apk <<< "$ASSETS" ||
               grep -Fxq dna-auto-release.json <<< "$ASSETS"; then
              echo "::error::A troca de assinatura só é permitida para a release legada com ambos os APKs e sem manifesto."
              exit 1
            fi
            echo "::notice::Migração legada autorizada. A nova assinatura será exigida nas próximas atualizações."
            exit 0
          fi
          if gh release view apk-latest >/dev/null 2>&1; then
            mkdir -p /tmp/dna-previous-apks
            gh release download apk-latest --pattern 'dna-auto-*.apk' --dir /tmp/dna-previous-apks
            BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
            for item in cliente oficina; do
              PREVIOUS="/tmp/dna-previous-apks/dna-auto-$item.apk"
              NEXT="dna-auto-$item.apk"
              if [ -s "$PREVIOUS" ]; then
                PREVIOUS_SHA=$("$BUILD_TOOLS/apksigner" verify --print-certs "$PREVIOUS" | awk -F ': ' '/Signer #1 certificate SHA-256 digest/{print $2;exit}')
                NEXT_SHA=$("$BUILD_TOOLS/apksigner" verify --print-certs "$NEXT" | awk -F ': ' '/Signer #1 certificate SHA-256 digest/{print $2;exit}')
                test -n "$PREVIOUS_SHA" && test -n "$NEXT_SHA"
                if [ "${PREVIOUS_SHA,,}" != "${NEXT_SHA,,}" ]; then
                  echo "::error::Assinatura Android incompatível com o APK $item já instalado. Recuperar a keystore ORIGINAL (não gerar outra) para atualizar sem desinstalar."
                  exit 1
                fi
              fi
            done
          fi

      - name: Criar manifesto de versões assinadas e obrigatoriedade individual
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          CLIENTE_VERSION: ${{ github.event.inputs.version_name || '2.5.7' }}
          CLIENTE_CODE: ${{ github.event.inputs.version_code || '257' }}
          OFICINA_VERSION: ${{ github.event.inputs.oficina_version_name || '2.5.9' }}
          OFICINA_CODE: ${{ github.event.inputs.oficina_version_code || '259' }}
          CLIENTE_REQUIRED: ${{ github.event.inputs.cliente_update_required }}
          OFICINA_REQUIRED: ${{ github.event.inputs.oficina_update_required }}
        run: node scripts/generate-apk-release-manifest.js

      - name: Extrair SHA-256 dos Certificados
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        id: cert
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          SHA_CLIENTE=$("$BUILD_TOOLS/apksigner" verify --print-certs dna-auto-cliente.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest/{print $2;exit}')
          SHA_OFICINA=$("$BUILD_TOOLS/apksigner" verify --print-certs dna-auto-oficina.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest/{print $2;exit}')
          test -n "$SHA_CLIENTE" && test -n "$SHA_OFICINA"
          echo "SHA256 Cliente: $SHA_CLIENTE"
          echo "SHA256 Oficina: $SHA_OFICINA"
          echo "sha256_cliente=$SHA_CLIENTE" >> $GITHUB_OUTPUT
          echo "sha256_oficina=$SHA_OFICINA" >> $GITHUB_OUTPUT

      - name: Publicar Artifacts dna-auto-apks
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: dna-auto-apks
          path: |
            dna-auto-cliente.apk
            dna-auto-oficina.apk
            dna-auto-release.json

      - name: Publicar Release Pública 'apk-latest'
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="APKs assinados com keystore persistente. GPS em segundo plano com consentimento e alertas de hodômetro."
          if [ "${{ inputs.migrate_legacy_signature }}" = true ]; then
            RELEASE_NOTES="$RELEASE_NOTES A assinatura mudou. Quem tem a versão anterior deve desinstalá-la e instalar este APK uma vez. Dados guardados apenas no aparelho podem ser apagados."
          fi
          VNAME="Cliente v${{ github.event.inputs.version_name || '2.5.7' }} / Oficina v${{ github.event.inputs.oficina_version_name || '2.5.9' }}"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release delete-asset apk-latest dna-auto-release.json -y >/dev/null 2>&1 || true
            gh release upload apk-latest dna-auto-cliente.apk dna-auto-oficina.apk --clobber
            gh release upload apk-latest dna-auto-release.json --clobber
            gh release edit apk-latest --title "DNA AUTO APKs — ${VNAME}" --notes "$RELEASE_NOTES"
          else
            gh release create apk-latest dna-auto-cliente.apk dna-auto-oficina.apk dna-auto-release.json \
              --title "DNA AUTO APKs — ${VNAME}" \
              --notes "$RELEASE_NOTES"
          fi
