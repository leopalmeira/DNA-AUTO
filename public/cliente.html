/* Ajustes isolados de Login: não modificam Splash, Cadastro nem Dashboard */
#login {background:linear-gradient(180deg,#dceafa 0%,#eaf2fc 57%,#e1edfa 100%);overflow-x:hidden;}
#login .art-login {width:calc(100% + 30px);margin:0 -15px;aspect-ratio:254/190;max-height:none!important;height:auto!important;background-size:100% 100%;background-repeat:no-repeat;flex:none;}
#login .auth-form {margin:-9px -3px 0;position:relative;z-index:2;flex:1 0 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:18px 14px max(22px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -5px 20px #3157800b;background:linear-gradient(180deg,#eef5fe 0%,#e5effb 100%);}
#login .field {height:48px;min-height:48px;border-radius:12px;}
#login .field input {font-size:14px;}
#login .form-row {font-size:12px;margin:2px 0;}
#login .bluebtn {display:block;flex:none;width:100%;min-height:47px;height:47px;position:relative;z-index:10;touch-action:manipulation;pointer-events:auto;cursor:pointer;font-size:14px;}
#login .subline {margin:4px 0 0;font-size:12px;}
#login .google {min-height:44px;flex:none;margin:2px auto 0;}
#login .art-back {z-index:6;cursor:pointer;}
@media(max-height:650px){#login .art-login{aspect-ratio:254/163}#login .auth-form{gap:8px;padding-top:12px;padding-bottom:12px}#login .field{height:41px;min-height:41px}#login .bluebtn{height:42px;min-height:42px}}
@media(min-width:600px){#login{width:100%;}}

/* Dashboard: correção isolada de contraste, tipografia e distribuição */
#dashboard {color:#091b40!important;background:linear-gradient(180deg,#e9f1fb 0%,#dce8f7 100%);}
#dashboard .dashhead,#dashboard h1,#dashboard .subtitle {color:#091b40!important;}
#dashboard .cards {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-items:stretch;}
#dashboard .card {color:#0b1d43!important;min-width:0;min-height:112px;height:auto!important;aspect-ratio:1.13;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:11px 10px!important;border:1px solid #fff;background:linear-gradient(145deg,#f4f8ff,#e7effb);box-shadow:0 4px 11px #17395b15;line-height:1.22;overflow:hidden;}
#dashboard .card .iconline {flex:0 0 25px;min-height:25px;color:#0565f8!important;font-size:20px;}
#dashboard .card .title {display:block!important;opacity:1!important;visibility:visible!important;color:#081a3f!important;font-size:clamp(11px,3.1vw,13px)!important;font-weight:750!important;line-height:1.23!important;letter-spacing:-.15px;margin:4px 0 0!important;overflow-wrap:break-word;white-space:normal;text-shadow:none!important;}
#dashboard .card .metric {display:block!important;color:#075df3;font-size:clamp(10px,2.8vw,12px)!important;line-height:1.2!important;margin-top:auto!important;padding-top:5px;font-weight:650;white-space:normal;}
#dashboard .card .metric.green {color:#00984b!important;}
#dashboard .card .metric.red {color:#e92338!important;}
#dashboard .card .metric.orange {color:#d98500!important;}
#dashboard .card .metric.money {font-size:clamp(13px,3.9vw,17px)!important;font-weight:850!important;}
#dashboard .card .small {color:#3c587e!important;font-size:10px!important;margin-top:2px!important;}
#dashboard .vehicle strong {color:#0b1d43!important;opacity:1!important;}
#dashboard .vehicle small {color:#3d5c83!important;}
#dashboard .card.lock {background:linear-gradient(145deg,#e4ebf5,#d9e3f0)!important;}
#dashboard .card:active {transform:scale(.98);}
@media(max-width:340px){#dashboard{padding-left:13px!important;padding-right:13px!important}#dashboard .cards{gap:7px}#dashboard .card{padding:9px 8px!important;aspect-ratio:1.04}}
@media(min-width:600px){#dashboard .card .title{font-size:12px!important}#dashboard .card .metric{font-size:11px!important}}

/* Ajuste pontual: cards do Dashboard aproximadamente 10% menores. */
#dashboard .cards {gap: 10px !important; padding-inline: 6px !important;}
#dashboard .card {min-height: 101px !important; aspect-ratio: auto !important; height: 101px !important; padding: 9px 9px !important;}
#dashboard .card .iconline {flex-basis: 22px !important; min-height: 22px !important; font-size: 18px !important;}
#dashboard .card .title {margin-top: 3px !important;}
#dashboard .card .metric {padding-top: 3px !important;}
@media(max-width:340px){#dashboard .card{height:96px !important;min-height:96px !important}}

/* Ajuste isolado do dashboard: identidade visual e legibilidade */
#dashboard .dashhead {min-height:42px;align-items:center;gap:8px;}
#dashboard .dna-dash-brand {display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;white-space:nowrap;flex:1;}
#dashboard .dna-dash-brand svg {width:34px;height:29px;flex:none;display:block;}
#dashboard .dna-dash-brand span {display:flex;align-items:baseline;gap:3px;letter-spacing:-.65px;}
#dashboard .dna-dash-brand b {font-family:Arial,Helvetica,sans-serif;font-size:clamp(14px,4.1vw,18px);font-weight:900;color:#07163b;line-height:1;}
#dashboard .dna-dash-brand b:last-child {color:#0867f6;}
#dashboard .circle {width:34px;height:34px;display:grid;place-items:center;flex:none;color:#102c56;background:#f8fbff;}
#dashboard h1 {font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:800;letter-spacing:-.6px;line-height:1.2;}
#dashboard .subtitle {font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;}
#dashboard .card {font-family:Arial,Helvetica,sans-serif;}
#dashboard .card .title {font-family:Arial,Helvetica,sans-serif!important;font-size:clamp(11px,3.05vw,12.5px)!important;line-height:1.24!important;letter-spacing:-.22px!important;font-weight:750!important;color:#091b40!important;}
#dashboard .card .metric {font-family:Arial,Helvetica,sans-serif!important;font-size:clamp(10px,2.75vw,11.5px)!important;line-height:1.23!important;}
#dashboard .card .metric.money {font-size:clamp(13px,3.6vw,16px)!important;}
#dashboard .card .small {font-size:10px!important;line-height:1.2!important;}
#dashboard .vehicle strong {font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:800;}
@media(max-width:350px){#dashboard .dna-dash-brand svg{width:28px}#dashboard .dna-dash-brand b{font-size:14px}#dashboard .card .title{font-size:11px!important}}
